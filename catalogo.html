<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ofertas - Negosistema</title>
    <!-- Estilos del Ecosistema -->
    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="entorno-catalogo-ventas">


    <!-- MENÚ DE NAVEGACIÓN PREMIUM UNIFORME -->
<nav class="menu-navegacion-sistema" style="width: 100%;">
    <!-- 🟢 Cambiamos este contenedor a Flexbox con distribución a los extremos -->
    <div class="menu-enlaces-contenedor" style="display: flex !important; align-items: center !important; justify-content: space-between !important; width: 100% !important; box-sizing: border-box !important;">
        
        <!-- EXTREMO IZQUIERDO: Logo y Título -->
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-block;">
            <div class="brand">
                <i class="fa-solid fa-map-location-dot brand-icon"></i>
                <div class="brand-text">
                    <h1>Negosistema</h1>
                    <p class="subtitle">Buscador Macro de Alcaldías CDMX</p>
                </div>
            </div>
        </a>
        
        <!-- EXTREMO DERECHO: Botón de Anuncios -->
        <div class="nav-tabs-container" style="display: flex !important; align-items: center !important;">
            <a href="anunciate.html" class="btn-anunciate-header">
                <span class="icono-nav">📢</span> Anúnciate Aquí
            </a>
        </div>

    </div>
</nav>



<header class="catalog-header" style="max-width: 1400px; margin: 30px auto 0 auto; padding: 0 32px; text-align: left;">
    <h1 class="titulo-pagina-sistema" style="font-size: 2.2rem;">Ofertas Activas en la Zona</h1>
    <p class="subtitulo-pagina-sistema">Explora las promociones del barrio en tiempo real</p>
</header>


    <!-- CONTENEDOR CORE DEL ESCAPARATE -->
    <div class="catalog-container" style="max-width: 1400px; margin: 0 auto; padding: 20px 32px;">
        <div class="catalog-section panel-card-gis-vertical">
            <h4 class="titulo-seccion-gis"><i class="fa-solid fa-fire icon-active" style="color: #e74c3c;"></i> Promociones de Hoy</h4>
            <div id="contenedor-escaparate-grid" class="offers-grid" style="margin-top: 16px;"></div>
        </div>
    </div>

    <!-- PLACEHOLDERS TÉCNICOS OCULTOS -->
    <div style="display: none !important; visibility: hidden !important;">
        <div id="mapa-comercial-contenedor"></div>
        <div id="ofertasSliderTrack"></div>
        <input id="input-buscador-predictivo">
        <div id="resultados-autocompletado"></div>
        <div id="capas-inferiores-contenedor"></div>
        <button id="btn-switch-entorno"></button>
    </div>

    <!-- Scripts en orden de dependencia -->
    <script src="js/leaflet.js"></script>
    <script src="js/papaparse.min.js"></script>
    <script src="js/motor-mapas.js"></script>

    <script>
        window.addEventListener("load", () => {
            console.log("Escaparate Negosistema detectado. Conectando bases de datos...");
            const params = new URLSearchParams(window.location.search);
            const coloniaInicial = params.get("colonia") || localStorage.getItem("ultima_colonia_explorada") || "xalpa ii";

            window.latCentroColonia = 19.373;
            window.lngCentroColonia = -99.018;

            if (typeof cargarDatosComerciosHiperlocales === "function") {
                cargarDatosComerciosHiperlocales(coloniaInicial);
            }
        });
    </script>
    <!-- PIE DE PÁGINA OSCURO CORPORATIVO UNIFORME -->
<footer class="footer-maestro-sistema" style="margin-top: 40px;">
    <div class="footer-maestro-contenido" style="max-width: 1400px;">
        <p class="copyright" style="margin: 0;">&copy; 2026 <strong>Negosistema</strong>. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="terminos.html" class="enlace-legal-footer">
                <i class="fa-solid fa-scale-balanced"></i> Términos, Condiciones y Aviso de Privacidad
            </a>
        </div>
    </div>
</footer>
    <div style="display: none !important; visibility: hidden !important;">
        <!-- ... tus inputs y mapas ocultos ... -->
    </div>
</body>
</html>
