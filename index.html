<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negosistema - Mapa Geográfico</title>
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="css/leaflet.css">
    <!-- Estilos personalizados de la plataforma -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
        <!-- Menú de navegación del sistema -->
    <nav class="menu-navegacion-sistema">
        <div class="menu-enlaces">
            <a href="index.html" class="enlace-nav activo">
                <span class="icono-nav">🗺️</span> Mapa CDMX
            </a>
            <a href="comercial.html" class="enlace-nav">
