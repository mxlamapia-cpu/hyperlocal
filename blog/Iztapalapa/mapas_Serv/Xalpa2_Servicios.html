<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negosistema - Mapa Xalapa 2</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- Navegación de Regreso -->
    <nav class="navbar-mapa">
        <a href="../index.html" class="btn-regresar">🏠 Inicio</a>
        <span class="zona-titulo">📍 Xalapa 2 - Mapa Hiperlocal</span>
    </nav>

    <!-- Contenedor Pantalla Completa Dividida -->
    <div class="pantalla-mapa-container">
        
        <!-- El mapa de My Maps (Ocupa la mayor parte) -->
        <section class="seccion-mymaps">
            <!-- NOTA: Reemplaza el enlace de abajo por tu iframe compartido de My Maps -->
            <iframe src="https://google.com" width="100%" height="100%" allowfullscreen loading="lazy"></iframe>
        </section>

        <!-- Bloque de Slides / Promociones de la Zona -->
        <aside class="seccion-promos">
            <h3>🔥 Promociones de la Zona</h3>
            <div class="contenedor-slides">
                
                <!-- Slide Promo 1 -->
                <div class="slide-promo">
                    <span class="tag-promo">Descuento</span>
                    <h4>Panadería El Sol</h4>
                    <p>10% de descuento en pan dulce mostrando el pin del mapa.</p>
                    <a href="https://wa.me" class="btn-promo-whatsapp" target="_blank">Reclamar Promo 💬</a>
                </div>

                <!-- Slide Promo 2 -->
                <div class="slide-promo">
                    <span class="tag-promo 2x1">2x1</span>
                    <h4>Antojitos Doña Mary</h4>
                    <p>Todos los martes 2x1 en pozole mediano consumiendo en local.</p>
                    <a href="https://wa.me" class="btn-promo-whatsapp" target="_blank">Reclamar Promo 💬</a>
                </div>

            </div>
        </aside>

    </div>

</body>
</html>
