<!DOCTYPE html>
<html lang="es">
<head>

    <!-- 🌟 AQUÍ SE CONECTAN LOS ESTILOS GLOBALES DESDE TU CARPETA -->
    <link rel="stylesheet" href="./css/estilos.css">

        .btn-regresar { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #0a2540; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }

<body>

<div class="contenedor-productos">
