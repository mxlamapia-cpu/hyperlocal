<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negosistema - Mapa Comercial Hiperlocal</title>
    
    <!-- Hojas de Estilo Locales -->
    <link rel="stylesheet" href="css/leaflet.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

    <main class="app-container split-layout">
        
        <!-- BARRA LATERAL: Control de Entornos, Filtros Dinámicos y Navegación -->
        <aside class="sidebar-panel">
            <header class="sidebar-header">
                <a href="index.html" class="btn-regresar">
                    <i class="fa-solid fa-arrow-left"></i> Regresar al Inicio
                </a>
                <h2 id="titulo-colonia-actual" class="colonia-titulo">Cargando Colonia...</h2>
            </header>

            <!-- CONTROLLER PREMIUM: Switcher de Entornos (Productos / Servicios) -->
            <div class="switch-container-box">
                <button id="btn-switch-entorno" class="btn-switcher-premium" data-entorno="productos">
                    Ver Servicios <span id="emoji-switch">🛠</span>
                </button>
            </div>

            <!-- CONTENEDOR DE FILTROS: Capas Inferiores Dibujadas por JS -->
            <section class="filters-section">
                <h3><i class="fa-solid fa-filter"></i> Capas Comerciales</h3>
                <div id="capas-inferiores-contenedor" class="capas-lista-scroll">
                    <!-- Los switches e información se inyectan dinámicamente aquí -->
                    <div class="loading-placeholder">
                        <i class="fa-solid fa-spinner fa-spin"></i> Cargando filtros...
                    </div>
                </div>
            </section>

            <!-- SECCIÓN: Colonias Vecinas o Aledañas -->
            <section class="aledanas-section">
                <h3><i class="fa-solid fa-map-signs"></i> Colonias Aledañas</h3>
                <div id="contenedor-colonias-aledanas" class="aledanas-grid">
                    <!-- Botones de colonias vecinas inyectados aquí -->
                </div>
            </section>
        </aside>

        <!-- SECCIÓN CENTRAL: Canvas del Mapa Leaflet -->
        <section class="map-view-section">
            <div id="mapa-comercial-contenedor" class="map-canvas"></div>
        </section>

    </main>

    <!-- PIE DE PÁGINA ACCESIBLE FLOTANTE -->
    <footer class="floating-footer">
        <p>&copy; 2026 Negosistema. <a href="terminos.html">Términos y Condiciones</a></p>
    </footer>

    <!-- Scripts Locales -->
    <script src="js/leaflet.js"></script>
    <script src="js/papaparse.min.js"></script>
    <!-- Cerebro lógico central -->
    <script src="js/motor-mapas.js"></script>
</body>
</html>
