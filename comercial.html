<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negosistema - Mapa Comercial Hiperlocal</title>

    <!-- Hojas de Estilo Locales -->
    <link rel="stylesheet" href="css/leaflet.css" />
    <link rel="stylesheet" href="css/MarkerCluster.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="entorno-mapa-comercial">


    <!-- MENÚ DE NAVEGACIÓN PREMIUM UNIFORME -->
<nav class="menu-navegacion-sistema" style="width: 100%;">
    <!-- 🟢 Cambiamos este contenedor a Flexbox con distribución a los extremos -->
    <div class="menu-enlaces-contenedor" style="display: flex !important; align-items: center !important; justify-content: space-between !important; width: 100% !important; box-sizing: border-box !important;">
        
        <!-- EXTREMO IZQUIERDO: Logo y Título -->
        <a href="index.html" style="text-decoration: none; color: inherit; display: inline-block;">
            <div class="brand">
                <i class="fa-solid fa-map-location-dot brand-icon"></i>
                <div class="brand-text">
                    <h1>Negosistema</h1>
                    <p class="subtitle">Buscador Macro de Alcaldías CDMX</p>
                </div>
            </div>
        </a>
        
        <!-- EXTREMO DERECHO: Botón de Anuncios -->
        <div class="nav-tabs-container" style="display: flex !important; align-items: center !important;">
            <a href="anunciate.html" class="btn-anunciate-header">
                <span class="icono-nav">📢</span> Anúnciate Aquí
            </a>
        </div>

    </div>
</nav>


    <!-- CONTENEDOR CORE GENERAL -->
    <div class="contenedor-servicios-ventas" style="padding: 20px; max-width: 1400px; margin: 0 auto;">

<!-- CABECERA HIPERLOCAL UNIFICADA -->
<header style="text-align: center; margin-bottom: 25px; margin-top: 10px;">
    <a href="index.html" class="btn-regresar-sistema">
        <i class="fa-solid fa-arrow-left"></i> Regresar al Buscador Regional
    </a>
    <h1 id="titulo-colonia-actual" class="titulo-pagina-sistema" style="font-size: 2.2rem; text-transform: capitalize;">Cargando Colonia...</h1>
</header>


        <!-- BLOQUE DE COLONIAS ALEDAÑAS -->
        <section class="panel-card-gis-vertical" style="margin-bottom: 25px;">
            <h4 class="titulo-seccion-gis"><i class="fa-solid fa-map-signs" style="color: var(--primary-color);"></i> Colonias Aledañas</h4>
            <div id="contenedor-colonias-aledanas" class="aledanas-grid-auto">
                <!-- Botones de navegación rápida inyectados aquí por JS -->
            </div>
        </section>

        <!-- SLIDER DE OFERTAS PANORÁMICO -->
        <section class="ofertas-slider-container" style="margin-bottom: 25px;">
            <div class="ofertas-slider-viewport">
                <div class="ofertas-slider-track" id="ofertasSliderTrack">
                    <!-- El motor lógico GIS inyectará las tarjetas aquí -->
                </div>
            </div>
            <div class="nav-dots" id="ofertasNavDots"></div>
        </section>

        <!-- COMPONENTE DE BÚSQUEDA INTELIGENTE -->
        <section class="buscador-inteligente-container" style="position: relative; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <div style="position: relative; display: flex; align-items: center;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 16px; color: var(--text-muted);"></i>
                <input type="text" id="input-buscador-predictivo" placeholder="¿Qué estás buscando hoy? (Ej. tacos, farmacia)..." style="width: 100%; padding: 14px 16px 14px 45px; border: 1px solid var(--border-color); border-radius: var(--radius-premium); font-size: 15px; outline: none; box-shadow: var(--shadow-subtle);">
            </div>
            <div id="resultados-autocompletado"></div>
        </section>

        <!-- NÚCLEO INTERACTIVO: FLUJO VERTICAL APILADO -->
        <div class="nucleo-interactivo-vertical">

            <!-- 🛠️ UBICACIÓN DEL BOTÓN DE CAMBIO: ARRIBA DEL MAPA -->
            <div style="margin-bottom: 15px; display: flex; justify-content: center;">
                <button id="btn-switch-entorno" class="btn-switcher-premium btn-accesibilidad-macro" data-entorno="productos" style="max-width: 320px; background: var(--text-dark); color: #fff; border-radius: var(--radius-premium); box-shadow: 0 4px 12px rgba(15,23,42,0.15);">
                    Ver Servicios <span id="emoji-switch">🛠️</span>
                </button>
            </div>

            <!-- LIENZO GENERAL DEL MAPA -->
            <section class="seccion-mapa-completo" style="margin-bottom: 25px;">
                <div id="mapa-comercial-contenedor" class="map-canvas" style="width: 100%; height: 520px; min-height: 520px; border: 1px solid var(--border-color); border-radius: 15px; overflow: hidden; background: #fff; z-index: 1; position: relative !important; box-shadow: var(--shadow-subtle);"></div>
            </section>

            <!-- PARRILLA DE BOTONES DE LAS CAPAS -->
            <section class="panel-card-gis-vertical" style="margin-bottom: 25px;">
                <h4 class="titulo-seccion-gis"><i class="fa-solid fa-filter" style="color: #2563eb;"></i> Capas Comerciales de la Zona</h4>
                <div id="capas-inferiores-contenedor" class="capas-lista-parrilla-auto">
                    <div class="loading-placeholder">
                        <i class="fa-solid fa-spinner fa-spin"></i> Cargando filtros comerciales...
                    </div>
                </div>
            </section>
        </div>

    </div>

    <!-- Scripts Locales e Inicialización Síncrona -->
    <script src="js/leaflet.js"></script>
    <script src="js/leaflet.markercluster.js"></script>
    <script src="js/papaparse.min.js"></script>
    <script src="js/motor-mapas.js" defer></script>

    <!-- VISOR LIGHTBOX HD DINÁMICO INTEGRADO -->
    <div id="negosistema-lightbox-visor" style="display: none;">
        <button id="lightbox-btn-cerrar" aria-label="Cerrar visor">&times;</button>
        <div class="lightbox-contenido">
            <img id="lightbox-imagen-hd" src="" alt="Promoción Ampliada">
        </div>
    </div>

    <!-- PIE DE PÁGINA OSCURO CORPORATIVO PREMIUM UNIFORME -->
    <footer class="footer-maestro-sistema" style="background-color: #0f172a !important; color: #f8fafc !important; width: 100% !important; padding: 40px 20px !important; margin-top: 60px !important; border-top: 1px solid #1e293b !important; box-sizing: border-box !important;">
        <div class="footer-maestro-contenido" style="max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px;">
            
            <!-- Izquierda: Copyright -->
            <p class="copyright" style="margin: 0; font-size: 0.9rem; color: #94a3b8 !important; font-weight: 400;">
                &copy; 2026 <strong style="color: #ffffff !important; font-weight: 700;">Negosistema</strong>. Todos los derechos reservados.
            </p>
            
            <!-- Derecha: Enlaces Legales -->
            <div class="footer-links" style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                <a href="terminos.html" class="enlace-legal-footer" style="color: #38bdf8 !important; text-decoration: none; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: color 0.2s ease;">
                    <i class="fa-solid fa-scale-balanced"></i> Términos, Condiciones y Aviso de Privacidad
                </a>
                
                <!-- El enlace 'P' con su ID intacto para el script -->
                <a href="catalogo.html" class="enlace-legal-footer escaparate-p" id="enlaceEscaparateStaging" title="Ver escaparate de pruebas en Staging" style="color: #475569 !important; text-decoration: none; font-size: 0.85rem; margin-left: 8px; font-weight: bold;">P</a>
            </div>

        </div>

        <!-- Script de automatización de rutas del sistema -->
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const enlace = document.getElementById("enlaceEscaparateStaging");
                if (enlace) {
                    const ultimaColonia = localStorage.getItem("ultima_colonia_explorada") || "xalpa ii";
                    enlace.href = `catalogo.html?colonia=${encodeURIComponent(ultimaColonia)}`;
                }
            });
        </script>
    </footer>

</body>
</html>
